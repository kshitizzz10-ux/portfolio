<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    .node-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 10px; fill: #CBD5E1; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #F59E0B; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="500" rx="16" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.10">
    <line x1="0" y1="100" x2="1000" y2="100" stroke="#38BDF8" stroke-width="1"/>
    <line x1="0" y1="200" x2="1000" y2="200" stroke="#38BDF8" stroke-width="1"/>
    <line x1="0" y1="300" x2="1000" y2="300" stroke="#38BDF8" stroke-width="1"/>
    <line x1="0" y1="400" x2="1000" y2="400" stroke="#38BDF8" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#38BDF8" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#38BDF8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#38BDF8" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="500" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Header Badge -->
  <rect x="30" y="25" width="460" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="45" y="49" class="label">Retail Demand Forecasting &amp; Replenishment Architecture</text>

  <rect x="510" y="25" width="240" height="36" rx="8" fill="#14532D" stroke="#22C55E" stroke-opacity="0.4"/>
  <text x="525" y="48" font-family="system-ui" font-weight="700" font-size="12" fill="#86EFAC">Champion Model: XGBoost (8.32% MAPE)</text>

  <!-- Flow Connector Line across all stages -->
  <path d="M 175 180 L 225 180 M 375 180 L 425 180 M 575 180 L 625 180 M 775 180 L 825 180" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4"/>

  <!-- Stage 1: Ingestion & Exogenous Data -->
  <g transform="translate(25, 95)">
    <rect width="155" height="180" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="130" height="24" rx="6" fill="#0284C7" fill-opacity="0.2"/>
    <text x="20" y="29" class="node-title" fill="#38BDF8">1. Multi-Source Ingestion</text>
    <text x="16" y="58" class="node-sub">• 3M+ Store Sales Ticks</text>
    <text x="16" y="78" class="node-sub">• 54 Stores x 33 Families</text>
    <text x="16" y="98" class="node-sub">• WTI Crude Oil Daily Index</text>
    <text x="16" y="118" class="node-sub">• Holiday Calendar &amp; Locale</text>
    <text x="16" y="138" class="node-sub">• Daily In-Store Transactions</text>
    <text x="16" y="158" class="node-sub">• Automated Data Hygiene</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="215,180 205,175 205,185" fill="#F59E0B"/>

  <!-- Stage 2: Feature Engineering -->
  <g transform="translate(225, 95)">
    <rect width="155" height="180" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="12" y="12" width="130" height="24" rx="6" fill="#D97706" fill-opacity="0.2"/>
    <text x="20" y="29" class="node-title" fill="#FBBF24">2. Feature Engineering</text>
    <text x="16" y="58" class="node-sub">• 27 Total Predictors</text>
    <text x="16" y="78" class="node-sub">• Lagged Demands (t-1..30)</text>
    <text x="16" y="98" class="node-sub">• Rolling Mean / Std Windows</text>
    <text x="16" y="118" class="node-sub">• Bi-Monthly Payday Surge</text>
    <text x="16" y="138" class="node-sub">• Promo Lift Multipliers</text>
    <text x="16" y="158" class="node-sub">• Zero Data-Leakage Splits</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="415,180 405,175 405,185" fill="#F59E0B"/>

  <!-- Stage 3: ML Benchmark Engine -->
  <g transform="translate(425, 95)">
    <rect width="155" height="180" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect x="12" y="12" width="130" height="24" rx="6" fill="#059669" fill-opacity="0.2"/>
    <text x="20" y="29" class="node-title" fill="#34D399">3. ML Model Engine</text>
    <text x="16" y="58" class="node-sub">• Out-of-Time Test (16d)</text>
    <text x="16" y="78" class="node-sub" font-weight="700" fill="#FBBF24">&#9733; XGBoost Regressor (8.3%)</text>
    <text x="16" y="98" class="node-sub">• Prophet Additive (10.8%)</text>
    <text x="16" y="118" class="node-sub">• Auto-ARIMA Baseline (18.2%)</text>
    <text x="16" y="138" class="node-sub">• 54.3% Error Reduction</text>
    <text x="16" y="158" class="node-sub">• Empirical 95% CI Bounds</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <polygon points="615,180 605,175 605,185" fill="#F59E0B"/>

  <!-- Stage 4: Stochastic Inventory Optimization -->
  <g transform="translate(625, 95)">
    <rect width="155" height="180" rx="12" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="12" y="12" width="130" height="24" rx="6" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="20" y="29" class="node-title" fill="#818CF8">4. Inventory Policy</text>
    <text x="16" y="58" class="node-sub">• Lead Time Demand (LTD)</text>
    <text x="16" y="78" class="node-sub">• Dynamic Safety Stock (SS)</text>
    <text x="16" y="98" class="node-sub">• Reorder Point: ROP = LTD+SS</text>
    <text x="16" y="118" class="node-sub">• 95% Cycle Service Level</text>
    <text x="16" y="138" class="node-sub">• Urgency: CRITICAL/WARN/OK</text>
    <text x="16" y="158" class="node-sub">• Working Capital Protection</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <polygon points="815,180 805,175 805,185" fill="#F59E0B"/>

  <!-- Stage 5: Star Schema & Serving Layer -->
  <g transform="translate(825, 95)">
    <rect width="150" height="180" rx="12" fill="#0F172A" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="12" y="12" width="125" height="24" rx="6" fill="#DB2777" fill-opacity="0.2"/>
    <text x="20" y="29" class="node-title" fill="#F472B6">5. BI &amp; Serving</text>
    <text x="16" y="58" class="node-sub">• SQLite Star Schema</text>
    <text x="16" y="78" class="node-sub">• dim_product (1:N joins)</text>
    <text x="16" y="98" class="node-sub">• fact_replenishment</text>
    <text x="16" y="118" class="node-sub">• Power BI Star Schema</text>
    <text x="16" y="138" class="node-sub">• Interactive Streamlit App</text>
    <text x="16" y="158" class="node-sub">• Sub-10s End-to-End Run</text>
  </g>

  <!-- Lower Metric & Formula Ribbon -->
  <g transform="translate(25, 295)">
    <rect width="950" height="95" rx="12" fill="#0F172A" stroke="#1E293B"/>
    
    <g transform="translate(20, 20)">
      <text x="0" y="0" font-family="system-ui" font-weight="700" font-size="12" fill="#F59E0B">OPERATIONS RESEARCH FORMULATION</text>
      <text x="0" y="22" font-family="monospace" font-size="12" fill="#E2E8F0">SS = Z * sqrt(L * sigma_d^2 + d^2 * sigma_L^2)  |  ROP = (d_forecast * L) + SS  |  Z = 1.65 (95% Service Level)</text>
      <text x="0" y="44" font-family="system-ui" font-size="11" fill="#94A3B8">Translates model uncertainty sigma_d directly into SKU safety buffers, preventing both catastrophic stockouts and dead capital.</text>
    </g>

    <g transform="translate(740, 22)">
      <rect width="180" height="50" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="90" y="22" font-family="system-ui" font-weight="700" font-size="15" fill="#FBBF24" text-anchor="middle">54.3% ERROR DROP</text>
      <text x="90" y="38" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">XGBoost 8.32% vs ARIMA 18.21%</text>
    </g>
  </g>

  <!-- Bottom Orchestration Banner -->
  <rect x="25" y="415" width="950" height="58" rx="10" fill="#0F172A" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="50" y="448" font-family="system-ui" font-weight="700" font-size="13" fill="#F59E0B">&#9889; Production Ready Pipeline</text>
  <text x="245" y="448" font-family="system-ui" font-size="11" fill="#CBD5E1">Modular Python Architecture | Config &amp; Feature Store | Unit Tested (11/11 Passing) | Power BI Star Schema &amp; Streamlit Live Serving</text>
</svg>
